<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:relative;width:min(100vw,480px);height:100dvh;margin:0 auto;overflow:hidden;background:#000}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.lid{position:absolute;left:0;right:0;height:50.5%;background:#000;transition:transform .5s ease-in-out}
#lidT{top:0}#lidB{bottom:0}
.txt{color:#fff;font-weight:800;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 2px 6px #000;line-height:1.25}
#title{font-family:"Marck Script","Segoe Script","Brush Script MT",cursive;font-weight:400;-webkit-text-stroke:0;text-shadow:0 0 20px rgba(255,255,255,.45);font-size:58px;line-height:1.3;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;opacity:0;transition:opacity 2s;white-space:pre-line;z-index:5;pointer-events:none}
#lines{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));padding:0 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;z-index:5;pointer-events:none}
.line{font-size:24px;opacity:0;max-height:220px;transform-origin:center bottom;transition:opacity 1s,transform .8s,max-height .7s,margin .7s}
.ch{opacity:0;transition:opacity .3s}.ch.on{opacity:1}
.line.show{opacity:1}
.line.back{transform:scale(.67)}
.line.show.back{opacity:.5}
.line.me{color:#5b9bd5}
.line.gone{opacity:0!important;max-height:0;margin:-8px 0 0}
#center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 22px;text-align:center;font-size:26px;opacity:0;transition:opacity 1s;z-index:5;pointer-events:none}
#ring{position:absolute;left:0;right:0;top:55%;text-align:center;font-size:30px;opacity:0;transition:opacity 1s,top 1s;z-index:5;pointer-events:none}
#btns{position:absolute;left:0;right:0;top:55%;display:flex;gap:10px;z-index:7;padding:0 14px}
#btns.end{justify-content:flex-end;padding:0 10px 0 0;top:calc(77% + 20px)}
#btns.center{justify-content:center}
#btns.corner{left:0;right:0;top:auto;bottom:calc(23% - 72px);flex-direction:column;align-items:flex-end;padding:0 10px 0 0;gap:8px;max-height:62%;overflow-y:auto}
#btns.corner .btn{max-width:82%}
#btns.cust{right:auto;padding:0;transform:translate(-50%,-50%);flex-direction:column;align-items:stretch;width:max-content;max-width:88%;gap:8px;max-height:80%;overflow-y:auto}
#btns.col{flex-direction:column;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:62%;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px;gap:8px}
#btns.col .btn{flex:none;width:100%;font-size:15px;padding:11px 12px;text-align:center}
.btn{font:700 17px system-ui,sans-serif;color:#fff;background:rgba(20,20,20,.78);border:2px solid rgba(255,255,255,.85);padding:13px 22px;border-radius:14px;opacity:0;transition:opacity 1s}
#btns.row .btn{flex:1;font-size:14px;padding:12px 8px}
.btn.show{opacity:1}
.btn:active{background:rgba(70,70,70,.9)}
#list{position:absolute;left:18px;right:18px;top:26%;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:16px;z-index:6;opacity:0;transition:opacity 1s;pointer-events:none}
#list.show{opacity:1;pointer-events:auto}
#list h3{margin:0 0 10px;color:#fff;font-size:19px}
.item{display:flex;align-items:center;gap:12px;color:#fff;font-size:18px;padding:10px 0}
.box{width:28px;height:28px;border:2px solid #fff;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px;z-index:20;background:#000}
#editor,#exitpv{display:none}
body.edit:not(.pv) #editor{display:block}
body.edit:not(.pv) #stage{display:none}
body.pv #exitpv{display:block}
#exitpv{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:30;opacity:.6;background:#000;color:#fff;border:1px solid #888;border-radius:10px;padding:8px 12px;font-size:14px}
#editor{position:fixed;inset:0;overflow:auto;background:#141414;color:#eee;font:15px system-ui,sans-serif;user-select:text}
#editor *{user-select:text}
#editor .wrap{max-width:520px;margin:0 auto;padding:0 12px 60px}
#editor .top{position:sticky;top:0;background:#141414;padding:10px 0;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#editor button,#editor select{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 10px;font-size:14px}
#eSt{font-size:13px;color:#9c9;margin:4px 0 10px}
.card{background:#1e1e1e;border:1px solid #3a3a3a;border-radius:12px;padding:10px;margin:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ctr button{padding:6px 10px;margin-left:4px}
.fld{display:block;margin:8px 0}.fld span{display:block;font-size:12px;color:#aaa;margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:9px;font:15px system-ui}
.pmap{position:relative;width:170px;aspect-ratio:9/18;margin:6px 0;background:#050505;border:2px solid #666;border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pmap i{position:absolute;pointer-events:none;background:rgba(255,255,255,.18)}
.pmap .gx{left:50%;top:0;bottom:0;width:1px}.pmap .gy{top:50%;left:0;right:0;height:1px}
.pmap.sx .gx{background:#4ade80;width:2px}.pmap.sy .gy{background:#4ade80;height:2px}
.pmap .pdot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:3px;pointer-events:none}
.pmap .pdot b{display:block;min-width:64px;padding:5px 8px;font:700 9px system-ui;color:#fff;text-align:center;background:rgba(20,20,20,.9);border:1.5px solid #fff;border-radius:8px}
.pmap .pz{position:absolute;left:0;right:0;text-align:center;font:10px system-ui;color:#777;pointer-events:none}
.pmx{font-size:12px;color:#aaa;margin:2px 0 6px}
.opt{border:1px dashed #666;border-radius:10px;padding:8px;margin:10px 0}
.nest{margin-left:6px;border-left:3px solid #4a6;padding-left:8px}.sub{font-size:12px;color:#aaa;margin-top:6px}
.addrow{display:flex;gap:6px;margin:10px 0}.addrow select{flex:1}
#editor .add{background:#245;border-color:#58a}#editor .del{background:#411;border-color:#a55;margin-top:6px}
#clock{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;font-size:20px;-webkit-text-stroke:3px #000;z-index:6;opacity:0;transition:opacity .6s;pointer-events:none}
#invbtn{display:none;position:absolute;top:calc(44px + env(safe-area-inset-top,0px));right:10px;z-index:9;width:46px;height:46px;padding:0;display:none;align-items:center;justify-content:center;font-size:26px;line-height:1;color:#fff;background:rgba(20,20,20,.78);border:2px solid rgba(255,255,255,.85);border-radius:50%}
#invp{display:none;position:absolute;left:18px;right:18px;top:16%;z-index:12;background:rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:16px;color:#fff}
#invp h3{margin:0 0 8px;font-size:20px}.iv{padding:9px 0;font-size:17px;border-bottom:1px solid rgba(255,255,255,.15)}
#invx{margin-top:12px;font:700 15px system-ui;color:#fff;background:#222;border:1px solid #888;border-radius:10px;padding:9px 16px}
#stl{margin-bottom:10px}#stl h4{margin:0 0 6px;font-size:13px;font-weight:600;opacity:.65}.stt{padding:8px 11px;margin-bottom:7px;border:1px solid rgba(255,255,255,.4);border-radius:10px;font-size:16px;font-weight:700}.mbar{margin-top:6px;height:9px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}.mbar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .5s}.stt small{display:block;margin-top:2px;font-size:13px;font-weight:400;opacity:.75}
#invl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{text-align:center;font-size:13px}
.th{aspect-ratio:1;border:2px solid #fff;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;background:#111;margin-bottom:4px}.th img{width:100%;height:100%;object-fit:contain}
#invd{display:none;position:absolute;left:12px;right:12px;top:8%;max-height:84%;overflow:auto;z-index:14;background:rgba(0,0,0,.95);border:1px solid #888;border-radius:16px;padding:14px;color:#fff;text-align:center}
#invd img{max-width:100%;max-height:45vh;border-radius:12px}#invd p{font-size:16px;line-height:1.35}
#invd .row{display:flex;gap:10px;justify-content:center;margin-top:10px}#invd button{font:700 15px system-ui;color:#fff;background:#222;border:1px solid #888;border-radius:10px;padding:10px 16px}
#notices{position:absolute;left:0;right:0;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 200px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.nt{font-size:13px;font-weight:600;color:#fff;padding:6px 16px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(0,0,0,.6);opacity:0;transition:opacity .5s}
.nt.show{opacity:.9}.nt.show.back{opacity:.4}.nt.gone{opacity:0!important}.up{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#ending{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px;gap:18px;opacity:0;z-index:6;pointer-events:none}
#endT{font-family:"Marck Script","Segoe Script",cursive;font-weight:400;-webkit-text-stroke:0;font-size:42px;white-space:pre-line;text-shadow:0 0 18px rgba(255,255,255,.4)}
#endX{font-size:19px;font-weight:600;-webkit-text-stroke:0;opacity:.85;white-space:pre-line}
.bar{flex-wrap:wrap;gap:6px}.lf{display:flex;align-items:center;gap:8px}.lf input{width:20px;height:20px}
#table{position:absolute;inset:0;z-index:4;opacity:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#5d3d24,#2b1b0f 70%,#120a05)}
.pol{position:absolute;left:50%;top:44%;width:min(74%,340px);margin-left:calc(min(74%,340px) / -2);background:#f4f1ea;padding:10px 10px 8px;border-radius:3px;box-shadow:0 10px 26px rgba(0,0,0,.65);transition:transform 1s cubic-bezier(.2,.8,.3,1),opacity .4s,filter 1s}
.pol img{display:block;margin:0 auto;max-width:100%;max-height:44vh}
.cap{font-family:"Marck Script","Segoe Script",cursive;color:#222;font-size:19px;text-align:center;padding-top:8px;min-height:30px}
/* ===== компьютер ===== */
#pc{position:absolute;inset:0;z-index:25;display:none;opacity:0;transition:opacity .6s;flex-direction:column;background:#245edb;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;color:#000;cursor:none;overscroll-behavior:none}
#pc *{cursor:none}
#pcd{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse 55% 14% at 24% 16%,rgba(255,255,255,.95),transparent 72%),radial-gradient(ellipse 45% 11% at 80% 30%,rgba(255,255,255,.9),transparent 72%),radial-gradient(ellipse 130% 36% at 28% 112%,#53b43f 58%,transparent 59%),radial-gradient(ellipse 120% 32% at 92% 118%,#3b9a2e 58%,transparent 59%),linear-gradient(#2a6fdb,#8cc4ff 72%)}
#pci{position:absolute;left:10px;top:16px;display:flex;flex-direction:column;gap:12px}
.ic{width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border:1px dotted transparent;border-radius:4px}
.ic:active{background:rgba(40,90,200,.55);border-color:#fff}
.ic .ib{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.ic span{color:#fff;font:700 13px Tahoma,sans-serif;text-align:center;text-shadow:1px 1px 2px #000,0 0 3px #000}
#pct{flex:none;display:flex;align-items:center;gap:8px;height:calc(46px + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);background:linear-gradient(#3c7bf0,#245edb 15%,#1941a5);border-top:2px solid #5b95f5}
#pcx{height:100%;border:0;border-radius:0 18px 18px 0;padding:0 18px 0 12px;color:#fff;font:italic 800 15px Tahoma,sans-serif;background:linear-gradient(#4cb343,#2b7a22);box-shadow:inset 0 2px 3px rgba(255,255,255,.4),2px 0 4px rgba(0,0,0,.4);text-shadow:1px 1px 2px #000}
#pcx:active{filter:brightness(.85)}
#pctab{display:none;flex:1;min-width:0;color:#fff;font:700 13px Tahoma,sans-serif;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pcclk{margin-left:auto;height:100%;display:flex;align-items:center;padding:0 12px;color:#fff;font:13px Tahoma,sans-serif;background:linear-gradient(#0f9bf0,#0b6fd0);border-left:2px solid #0a4fa8}
#pcw{position:absolute;inset:10px 8px 8px 8px;display:none;flex-direction:column;background:#ece9d8;border:3px solid #0a3fc4;border-radius:9px 9px 0 0;box-shadow:0 6px 18px rgba(0,0,0,.55);overflow:hidden}
.pwt{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;background:linear-gradient(#3a8cf5,#0b4fd6);color:#fff;font:800 15px Tahoma,sans-serif;text-shadow:1px 1px 1px #003}
.pwx{width:28px;height:26px;border:1px solid #fff;border-radius:5px;background:linear-gradient(#e9775f,#c4361a);color:#fff;font:800 14px Tahoma,sans-serif;padding:0}
.pwb{flex:1;min-height:0;position:relative;overflow:hidden}
#pcc{position:absolute;left:0;top:0;width:22px;height:30px;z-index:99;pointer-events:none;opacity:0;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.45))}
#pcc svg{display:block}
.av{display:block;border-radius:50%}
/* змейка */
.sk{display:flex;flex-direction:column;align-items:center;height:100%;background:#d4d0c8}
.skh{width:100%;flex:none;display:flex;justify-content:space-between;padding:6px 12px;font:700 14px Tahoma,sans-serif}
.skw{position:relative;flex:none;touch-action:none}
.skw canvas{display:block;border:3px solid #000}
.sko{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;color:#fff;font:800 19px Tahoma,sans-serif;background:rgba(0,0,0,.42);padding:10px;text-shadow:1px 1px 2px #000;pointer-events:none}
.pad{flex:none;display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:56px 56px;gap:6px;margin:10px auto 0;touch-action:none}
.pad button{font-size:24px;padding:0;border:2px solid #444;border-radius:10px;background:linear-gradient(#fff,#ddd)}
.pad button:active{background:#bbb}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
/* конвейер */
.bl{display:flex;flex-direction:column;height:100%}
.bh{flex:none;display:flex;justify-content:space-between;padding:6px 12px;font:700 14px Tahoma,sans-serif;background:#ece9d8}
.bf{flex:1;min-height:0;position:relative;overflow:hidden;background:#222;touch-action:none}
.ln{position:absolute;left:0;right:0;box-sizing:border-box;border-top:4px solid #111;border-bottom:4px solid #111;background:repeating-linear-gradient(90deg,#464646 0 26px,#585858 26px 30px)}
.fo{position:absolute;left:0;width:116px;height:72px;box-sizing:border-box;background:#f0c75e;border:2px solid #b8902c;border-radius:3px 7px 7px 7px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font:800 12.5px/1.15 Tahoma,sans-serif;color:#4a3a10;box-shadow:0 3px 6px rgba(0,0,0,.5);touch-action:none}
.fo:before{content:"";position:absolute;left:-2px;top:-12px;width:46px;height:11px;background:#f0c75e;border:2px solid #b8902c;border-bottom:0;border-radius:5px 5px 0 0}
.fo.done{background:#e6d8a8}
.st{position:absolute;transform:translate(-50%,-50%) rotate(-14deg);color:#d3121a;border:3px solid #d3121a;border-radius:6px;padding:1px 6px;font:900 14px Tahoma,sans-serif;letter-spacing:1px;background:rgba(255,255,255,.35);pointer-events:none;animation:stmp .22s ease-out}
@keyframes stmp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.bo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;white-space:pre-line;color:#fff;background:rgba(0,0,0,.65);font:800 19px Tahoma,sans-serif}
.bo button,.sc button{font:800 16px Tahoma,sans-serif;padding:10px 20px;border:2px solid #444;border-radius:8px;background:linear-gradient(#fff,#ddd);color:#000}
.bf.flash{box-shadow:inset 0 0 0 5px #e22}
/* чат */
.ch2{display:flex;height:100%}
.chl{width:130px;flex:none;background:#f4f4f4;border-right:1px solid #999;overflow-y:auto}
.chi{position:relative;display:flex;gap:6px;align-items:center;padding:8px 6px;border-bottom:1px solid #ddd;background:#fff}
.chi.on{background:#cfe0ff}
.chi .av{width:32px;height:32px;flex:none}
.chi .t{min-width:0;flex:1}
.chi .n{font:700 13px Tahoma,sans-serif}
.chi .p{font-size:11px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{position:absolute;right:4px;top:6px;min-width:18px;height:18px;border-radius:9px;background:#e22;color:#fff;font:700 11px/18px Tahoma,sans-serif;text-align:center;font-style:normal}
.chm{flex:1;min-width:0;display:flex;flex-direction:column}
.cht{flex:none;padding:8px 10px;font:800 14px Tahoma,sans-serif;background:#e8eefb;border-bottom:1px solid #aab}
.chb{flex:1;min-height:0;overflow-y:auto;padding:8px;background:#dfe7f3;display:flex;flex-direction:column;gap:7px;touch-action:pan-y}
.chn{display:none;position:relative;flex:none;margin:-34px auto 6px;z-index:2;font:700 12px Tahoma,sans-serif;color:#fff;background:#2a6fdb;border:1px solid #fff;border-radius:14px;padding:6px 12px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.chf{flex:none;padding:7px 10px;font-size:12px;color:#777;background:#f2f2f2;border-top:1px solid #aab}
.msg{display:flex;gap:6px;align-items:flex-end;animation:mpop .25s}
.msg .av{width:30px;height:30px;flex:none}
.msg .nm{font-size:10.5px;color:#557;margin:0 0 1px 2px}
.msg .bb{background:#fff;border:1px solid #b9c3d6;border-radius:10px 10px 10px 2px;padding:5px 9px;font:14px/1.25 Tahoma,sans-serif;word-wrap:break-word;overflow-wrap:anywhere}
.sysm{align-self:center;font-size:11px;color:#667;font-style:italic;text-align:center}
@keyframes mpop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* засекречено */
.sc{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 22px;text-align:center;font-family:Tahoma,sans-serif}
.sc .sci{font-size:54px}
.sc .scp{font:700 16px Tahoma,sans-serif}
.sc input{width:100%;max-width:280px;font:18px Tahoma,sans-serif;padding:10px;border:2px solid #7f9db9;border-radius:4px;user-select:text;-webkit-user-select:text}
.sc .sce{min-height:20px;color:#c00;font-weight:700;font-size:14px}
.sc .sct{white-space:pre-line;font:16px/1.35 Tahoma,sans-serif;background:#fff;border:2px inset #999;padding:14px;width:100%;text-align:left}
.sc.shake input{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* ===== хлопковое поле ===== */
#cf{position:absolute;inset:0;z-index:24;display:none;opacity:0;transition:opacity .6s;overflow:hidden;background:linear-gradient(#3f9dff 0%,#9ed8ff 36%,#d9f1ff 50%);touch-action:manipulation}
#cfsun{position:absolute;right:26px;top:calc(40px + env(safe-area-inset-top,0px));width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#fffbb8 0,#ffe14d 50%,#ffb800 100%);box-shadow:0 0 0 14px rgba(255,225,70,.35),0 0 70px 34px rgba(255,235,130,.65);animation:cfp 4s ease-in-out infinite}
@keyframes cfp{50%{transform:scale(1.07)}}

<body>
<div id="stage">
  <img class="photo" id="pA" alt=""><img class="photo" id="pB" alt="">
  <div id="veil"></div>
  <div class="lid" id="lidT"></div><div class="lid" id="lidB"></div>

  <div id="pc">
    <div id="pcd"><div id="pci"></div><div id="pcw"></div></div>
    <div id="pct"><button id="pcx">⏻ Выйти из компьютера</button><span id="pctab"></span><span id="pcclk"></span></div>
    <div id="pcc"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M1.5 1.5 L1.5 23 L7 17.8 L10.8 27.2 L14.6 25.7 L10.9 16.6 L18.4 16.6 Z" fill="#fff" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
  </div>
  <button id="invbtn" aria-label="Инвентарь">🎒</button>
  <div id="invd"></div>
  <div id="invp"><h3>Инвентарь</h3><div id="stl"></div><div id="invl"></div><button id="invx">Закрыть</button></div>
  <button id="exitpv">← Редактор</button>
  <div id="start">Нажмите, чтобы начать</div>
</div>
<div id="editor"><div class="wrap"><div class="top"><button id="eP">▶ С начала</button><button id="eS">💾 Сохранить для всех</button><button id="eD">⬇ Файл</button><button id="eR">↺ Сброс</button></div><div id="eSt"></div><div id="eL"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const PHOTO_DIR=''; // папка с фото, например 'photos/' (если лежат рядом с index.html — оставь пустым)
const PHOTO_COUNT=12;
const LOCAL={};const url=n=>LOCAL[n]||PHOTO_DIR+n; // когда добавишь новые фото — увеличь число
for(let i=1;i<=PHOTO_COUNT;i++){new Image().src=PHOTO_DIR+'foto'+i+'.jpg'}

/* ---------- фото ---------- */
let cur=$('pA'),oth=$('pB');
async function setPhoto(n,ms=0){
  oth.src=url('foto'+n+'.jpg');
  oth.style.transition=cur.style.transition=ms?`opacity ${ms}ms`:'none';
  oth.style.opacity=1;cur.style.opacity=0;
  [cur,oth]=[oth,cur];
  await sleep(ms);
}
/* ---------- веки и затемнение ---------- */
let lidsOpen=false;
async function lids(f,ms){lidsOpen=f>=1;
  $('lidT').style.transition=$('lidB').style.transition=`transform ${ms}ms ease-in-out`;
  $('lidT').style.transform=`translateY(${-f*100}%)`;
  $('lidB').style.transform=`translateY(${f*100}%)`;
  await sleep(ms);
}
async function fade(to,ms){$('veil').style.transition=`opacity ${ms}ms`;$('veil').style.opacity=to;await sleep(ms)}
async function blinkOpen(){
  await lids(.5,700);await sleep(300);
  await lids(0,500);await sleep(500);
  await lids(1,1100);
}
async function shortBlink(n){await lids(0,160);await setPhoto(n,0);await lids(1,220)}

/* ---------- надписи-диалог ---------- */
let skip=null;
$('stage').addEventListener('pointerdown',()=>{if(skip)skip()});
function hold(ms){return new Promise(res=>{const t=setTimeout(done,ms);const t0=Date.now();
  function done(){clearTimeout(t);skip=null;res()}
  skip=()=>{if(Date.now()-t0>500)done()}})}
async function say(text,cls='',audio){
  let au=null,dur=0;
  if(audio){try{
    au=new Audio(LOCAL[audio]||audio);au.preload='auto';
    if(!(au.duration>0&&isFinite(au.duration)))await new Promise(r=>{au.onloadedmetadata=r;au.onerror=r;setTimeout(r,1500)});
    if(au.duration>0&&isFinite(au.duration))dur=au.duration;
    au.play().catch(()=>{});
  }catch(e){au=null}}
  const box=$('lines');
  const f=box.querySelector('.front'),b=box.querySelector('.back:not(.gone)');
  if(b){b.classList.add('gone');setTimeout(()=>b.remove(),800)}
  if(f){f.classList.remove('front');f.classList.add('back')}
  const el=document.createElement('div');
  el.className='line txt front '+cls;
  // видимая часть + невидимый «хвост»: перенос строк сразу как в финале, ничего не прыгает
  const vis=document.createElement('span'),hid=document.createElement('span');
  hid.style.visibility='hidden';hid.style.webkitTextStroke='0';hid.style.textShadow='none';
  el.append(vis,hid);
  box.appendChild(el);await raf();el.classList.add('show');
  const ch=Array.from(text);
  let fast=false;skip=()=>{fast=true};
  const t0=Date.now();
  if(dur){
    // текст печатается ровно под голос: последняя буква — к концу записи
    const w=ch.map(c=>/[.!?…]/.test(c)?7:/[,:;—-]/.test(c)?3.5:1),W=w.reduce((x,y)=>x+y,0)||1;
    let cum=0;
    for(let i=1;i<=ch.length;i++){
      cum+=w[i-1];
      vis.textContent=ch.slice(0,i).join('');
      hid.textContent=ch.slice(i).join('');
      if(!fast&&i<ch.length){const wait=t0+cum/W*dur*1000*.96-Date.now();if(wait>0)await sleep(wait)}
    }
    // текст остаётся, пока голос не договорит
    await hold(Math.max(250,dur*1000-(Date.now()-t0))+350);
    if(au)au.pause();
    return;
  }
  for(let i=1;i<=ch.length;i++){
    vis.textContent=ch.slice(0,i).join('');
    hid.textContent=ch.slice(i).join('');
    if(!fast&&i<ch.length)await sleep(/[.,!?…:]/.test(ch[i-1])?230:45);
  }
  await hold(900+text.length*22);
}
async function clearLines(){
  const els=[...$('lines').children];
  els.forEach(e=>e.classList.add('gone'));
  await sleep(900);els.forEach(e=>e.remove());
}
async function centerText(t,ms=3500){
  const c=$('center');c.textContent=t;c.style.opacity=1;await sleep(ms);c.style.opacity=0;await sleep(1000);
}

/* ---------- кнопки ---------- */
// align: 'end' (прижата вправо), 'center', 'row' (несколько в ряд)
function ask(labels,align='end',P){
  return new Promise(async res=>{
    let cust=null;
    if(P&&P.pos==='custom'&&isFinite(parseFloat(P.px))&&isFinite(parseFloat(P.py)))cust={x:parseFloat(P.px),y:parseFloat(P.py)};
    else if(P&&P.pos==='end')align=labels.length>1?'corner':'end';
    else if(P&&P.pos==='center'&&align==='end')align='center';
    if(!cust&&align==='row'&&labels.length>2)align='col';
    const w=$('btns');w.className=cust?'cust':align;w.removeAttribute('style');w.innerHTML='';w.scrollTop=0;
    if(cust){w.style.left=cust.x+'%';w.style.top=cust.y+'%'}
    const bs=labels.map((l,i)=>{
      const b=document.createElement('button');b.className='btn';b.textContent=l;
      b.addEventListener('pointerdown',e=>e.stopPropagation());
      b.addEventListener('click',async()=>{
        bs.forEach(x=>x.classList.remove('show'));await sleep(500);w.innerHTML='';res(i)});
      w.appendChild(b);return b});
    if(cust){
      // не даём блоку кнопок выйти за края экрана
      const S=$('stage').getBoundingClientRect(),r=w.getBoundingClientRect(),m=8;let dx=0,dy=0;
      if(r.left<S.left+m)dx=S.left+m-r.left;else if(r.right>S.right-m)dx=S.right-m-r.right;
      if(r.top<S.top+m)dy=S.top+m-r.top;else if(r.bottom>S.bottom-m)dy=S.bottom-m-r.bottom;
      if(dx)w.style.left='calc('+cust.x+'% + '+dx+'px)';
      if(dy)w.style.top='calc('+cust.y+'% + '+dy+'px)';
    }
    await raf();bs.forEach(b=>b.classList.add('show'));
  });
}

/* ---------- сцена-шаблон ---------- */
async function scene(n,lines){
  await setPhoto(n,0);
  await fade(0,2500);
  for(const [t,c] of lines)await say(t,c);
  await fade(1,2500);
  await clearLines();
  await ask(['Далее']);
}

/* ---------- СЮЖЕТ (по умолчанию; потом берётся из story.json) ---------- */
const S=(text,who)=>({type:'say',text,who:who||'npc'});
const V=to=>({type:'veil',to:String(to)});
const B=(label,align)=>({type:'button',label:label||'Далее',align:align||'end'});
const P=(n,fx)=>({type:'photo',n:String(n),fx});
const DEFAULT={steps:[
 {type:'title',text:'Акт 1:\nНачало'},P(1,'hidden'),
 S('— Гоша, ты опять напился?!'),S('— Да не пил я!'),S('— А ну дыхни.'),S('— Ой, смотри, что это?'),S('— Что?'),
 {type:'blink'},
 S('— Да это же ребёнок!'),S('— Привет, сахарок ☺️'),P(2,'shortblink'),
 S('— А сахарок-то подгоревший 😏'),S('— Да помолчи ты!'),V(1),B(),
 P(3,'cut'),V(0),S('— С днём рождения! Это Олег, хорошо ухаживай за ним.'),S('— Укх бу юа бы эт'),S('— Что ты делаешь?'),S('— Перевожу это на её язык, чтобы ей было понятнее.'),S('— *вздох разочарования в идиоте*'),V(1),B(),
 P(4,'cut'),V(0),S('— Поздравляю с 10-летием, уголёк! Расти большой, чтобы легко доставать до самых высоких пальм с кокосами!'),S('— Не слушай папу, солнышко, у этой пьяни все мозги уже пропиты.'),V(1),B(),
 P(5,'cut'),V(0),S('— С 15-летием, Дашулепулешушечучечка! Ты уже такая большая 😢 Держи подарок, скоро торт начнём резать!'),B(),
 P(6,'fade'),S('— Спасибо, я отнесу его в комнату?','me'),S('— Да, конечно.'),B(),

}

function applyInv(s){

  else if(s.action==='activate'){if(i>=0)activateItem(inv[i],true);else act.push(n)}
  else if(s.action==='deactivate'){act=act.filter(a=>!a.toLowerCase().includes(n.toLowerCase()))}
  else{

    if(s.desc)it.desc=s.desc;

async function photo(s){

  if(fx==='hidden'){if(lidsOpen)await lids(0,450);await setPhoto(n,0);return}
  if(fx==='shortblink'){await shortBlink(n);return}
  await clearLines();
  if(!lidsOpen)await lids(1,0);
  if(fx==='cut')await setPhoto(n,0);
  else if(fx==='quick')await setPhoto(n,400);

}

async function doStep(s,id){
  switch(s.type){
  case 'title':{const T=$('title');T.textContent=s.text;T.style.opacity=1;await sleep(4000);T.style.opacity=0;await sleep(2500);break}
  case 'say':await say(s.text||'',s.who==='me'?'me':'',s.audio);break;
  case 'center':await centerText(s.text||'');break;
  case 'photo':await photo(s);break;
  case 'veil':await fade(+s.to,2500);if(+s.to===1)await clearLines();break;
  case 'blink':await blinkOpen();break;
  case 'button':await ask([s.label||'Далее'],s.align||'end',s);await clearLines();break;
  case 'call':{
    const R=$('ring');R.style.top='55%';R.textContent=s.text||'*звонок*';R.style.opacity=1;
    await sleep(1300);R.style.top='46%';
    await ask([s.label||'Взять трубку'],'center');R.style.opacity=0;break}
  case 'checklist':{
    const I=$('items');I.innerHTML='';$('list').querySelector('h3').textContent=s.title||'';
    const its=s.items||[];let left=its.length;
    const done=new Promise(res=>{
      if(!left)res();
      its.forEach((t,k)=>{
        const d=document.createElement('div');d.className='item';
        d.innerHTML='<div class="box"></div><div></div>';d.lastChild.textContent=(k+1)+') '+t;
        let on=false;
        d.addEventListener('pointerdown',e=>e.stopPropagation());
        d.addEventListener('click',()=>{if(on)return;on=true;d.firstChild.textContent='✓';if(--left===0)res()});
        I.appendChild(d)})});
    $('list').classList.add('show');await done;await sleep(400);invOn=true;updInv();
    await ask([s.label||'Далее']);$('list').classList.remove('show');await sleep(1000);break}
  case 'clock':showClock(s.text);break;
  case 'inv':applyInv(s);if(s.text)await notice(s.text,s.wait!=='0',s.sec);break;
  case 'notice':await notice(s.text||'',s.wait!=='0',s.sec);break;
  case 'meter':applyMeter(s);break;
  case 'status':{
    const ch=applyStatus(s);
    if(ch&&s.vis!=='0'&&s.action!=='remove')await notice(s.text||('Новый статус: '+(s.name||'').trim()),s.wait!=='0',s.sec);
    else if(ch&&s.action==='remove'&&s.text)await notice(s.text,s.wait!=='0',s.sec);
    break}
  case 'if':{
    const n=(s.name||'').trim(),a=isAct(n),hv=invFind(n)>=0,hs=chk(n);
    const ok=s.cond==='notactive'?!a:s.cond==='have'?hv:s.cond==='hasst'?hs:s.cond==='nost'?!hs:a;
    await runSteps((ok?s.then:s.else)||[],id);break}
  case 'cotton':await runCotton(s);break;
  case 'mop':await runMop(s);break;
  case 'soup':await runSoup(s);break;
  case 'rope':await runRope(s);break;
  case 'computer':await runComputer(s);break;
  case 'ending':{
    await fade(1,2500);await clearLines();
    if(!lidsOpen)await lids(1,0);
    const E=$('ending'),tbl=s.mode==='table'&&(s.cards||[]).length;
    if(tbl)await tableShow(s.cards,parseFloat(s.secAll)||0);
    else if(s.bg){await setPhoto(+s.bg,0);await fade(.55,2000)}
    E.style.background=tbl?'rgba(0,0,0,.55)':'';
    $('endT').textContent=s.title||'Конец';$('endX').textContent=s.text||'';
    E.style.transition='opacity 2s';E.style.opacity=1;
    const ea=s.audio?new Audio(LOCAL[s.audio]||s.audio):null;
    if(ea){ea.play().catch(()=>{});await Promise.race([new Promise(r=>{ea.onended=r;ea.onerror=()=>setTimeout(r,2500)}),sleep(40000)]);ea.pause();await sleep(800)}
    else await sleep(2500);
    if(s.restart){await ask(['Начать заново'],'center');startGame(0)}
    await new Promise(()=>{});break}
  case 'choice':{
    const o=s.options||[];let idx=o.map((_,i)=>i);
    while(idx.length){
      const av=idx.filter(i=>optOk(o[i]));
      if(!av.length)break;
      const labels=av.map(i=>o[i].label);
      const k=await ask(labels,labels.length>1?'row':'center',s);CHK(id);
      const op=o[av[k]];
      await runSteps(op.steps||[],id);
      if(op.back&&av.length>1)idx.splice(idx.indexOf(av[k]),1);else break}
    break}
  }
}

        ob.append(field(o,['back','После этого варианта','sel',[['','Идти дальше по сюжету'],['1','Вернуться к выбору (этот вариант пропадёт)']]]));
        ob.append(h('div','sub','Что происходит после нажатия:'));
        const n=h('div','nest');renderList(o.steps,n,false);ob.append(n);
        const del=h('button','del','Удалить вариант');del.onclick=()=>{if(s.options.length>1&&confirm('Удалить вариант?')){s.options.splice(k,1);changed();redraw()}};
        ob.append(del);c.append(ob)});
      const add=h('button','add','+ Ещё вариант');add.onclick=()=>{s.options.push({label:'',back:'',steps:[]});changed();redraw()};c.append(add);
    }
    if(s.type==='ending'){s.cards=s.cards||[];c.append(h('div','sub','Фотографии на столе — по порядку, каждая ложится на предыдущую (нужен вид «Фотографии на столе»):'));const n=h('div','nest');renderList(s.cards,n,false,['card']);c.append(n)}
    if(s.type==='if'){[['then','Тогда:'],['else','Иначе (необязательно):']].forEach(([k,l])=>{s[k]=s[k]||[];c.append(h('div','sub',l));const n=h('div','nest');renderList(s[k],n,false);c.append(n)})}
    parent.append(c);
  });
  const row=h('div','addrow'),sel=h('select');
  (kinds||Object.keys(TYPES).filter(k=>!TYPES[k].hid)).forEach(k=>{const o=h('option','',TYPES[k].name);o.value=k;sel.append(o)});
  const b=h('button','add','+ Добавить');b.onclick=()=>{steps.push(TYPES[sel.value].d());changed();redraw()};
  row.append(sel,b);parent.append(row);
  const r2=h('div','addrow');
  const cp=h('button','','📋 Копировать отмеченные');
  cp.onclick=()=>{const g=steps.filter(x=>SEL.has(x));if(!g.length){eSt('Сначала отметь галочками нужные блоки.');return}
    CLIP=g.map(x=>JSON.parse(JSON.stringify(x)));localStorage.setItem('clip',JSON.stringify(CLIP));g.forEach(x=>SEL.delete(x));redraw();eSt('Скопировано блоков: '+CLIP.length+'. Открой нужное место и нажми «Вставить».')};
  const ps=h('button','','📥 Вставить ('+CLIP.length+')');
  ps.onclick=()=>{if(!CLIP.length){eSt('Сначала скопируй блоки.');return}CLIP.forEach(x=>steps.push(JSON.parse(JSON.stringify(x))));changed();redraw()};
  r2.append(cp,ps);parent.append(r2);
}
function ghAuth(){
  const m=location.hostname.match(/^(.+)\.github\.io$/);
  let repo=m?m[1]+'/'+location.pathname.split('/')[1]:(localStorage.gh_repo||prompt('Репозиторий в формате имя/репозиторий'));
  if(!m&&repo)localStorage.gh_repo=repo;
  let tk=localStorage.gh_token||prompt('Вставь токен GitHub (он хранится только в этом браузере)');
  if(!tk||!repo)throw new Error('Нужен токен GitHub');
  localStorage.gh_token=tk;
  return {repo,hd:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'}};
}
async function ghPut(path,blob,msg){
  const a=ghAuth(),api=`https://api.github.com/repos/${a.repo}/contents/${path}`;
  const b64=typeof blob==='string'?btoa(unescape(encodeURIComponent(blob))):await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(blob)});
  let sha;const g=await fetch(api,{headers:a.hd,cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('Ошибка '+g.status+' — проверь токен');
  const r=await fetch(api,{method:'PUT',headers:a.hd,body:JSON.stringify({message:msg,content:b64,sha})});
  if(!r.ok)throw new Error('Ошибка '+r.status+' — проверь токен и права');
}
async function nextNum(prefix,dir){
  const a=ghAuth();
  const r=await fetch(`https://api.github.com/repos/${a.repo}/contents/${dir||''}`,{headers:a.hd,cache:'no-store'});
  if(!r.ok)throw new Error('Не удалось прочитать список файлов ('+r.status+')');
  const re=new RegExp('^'+prefix+'(\\d+)\\.');let m=0;
  (await r.json()).forEach(f=>{const x=f.name.match(re);if(x)m=Math.max(m,+x[1])});
  return m+1;
}
async function publish(){
  eSt('Сохраняю…');
  try{await ghPut('story.json',JSON.stringify(story,null,1),'Обновление сюжета');eSt('✅ Сохранено. У всех обновится через 1–2 минуты.')}
  catch(e){eSt('❌ '+e.message);if(/токен/.test(e.message))localStorage.removeItem('gh_token')}
}
const pickFile=accept=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>r(i.files[0]||null);i.click()});
async function toJpeg(file){
  const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.88));
}
async function toWav(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
  const sr=22050,n=Math.max(1,Math.round(buf.duration*sr));
  const oc=new OfflineAudioContext(1,n,sr),src=oc.createBufferSource();
  src.buffer=buf;src.connect(oc.destination);src.start();
  const out=(await oc.startRendering()).getChannelData(0);
  const v=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,out[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  return new Blob([v],{type:'audio/wav'});
}
let rec=null;
async function recToggle(btn,done){
  if(rec){rec.stop();return}
  const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];
  rec=new MediaRecorder(st);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());rec=null;btn.textContent='🎙 Записать';
    try{eSt('Обрабатываю запись…');await done(await toWav(new Blob(ch)))}catch(e){eSt('❌ '+e.message)}};
  rec.start();btn.textContent='⏹ Стоп';eSt('Идёт запись… нажми «Стоп», когда закончишь.');
}
function posField(s,label,cnt){
  const w=h('label','fld');w.append(h('span','',label));
  const sel=h('select');
  [['center','По центру'],['end','Как «Далее» — справа внизу'],['custom','Своё место на экране']].forEach(([v,t])=>{const o=h('option','',t);o.value=v;sel.append(o)});
  sel.value=s.pos||(s.type==='button'&&s.align!=='center'?'end':'center');
  w.append(sel);
  const box=h('div'),map=h('div','pmap'),dot=h('div','pdot'),info=h('div','pmx');
  const n=Math.max(1,Math.min(5,cnt?cnt(s):1));
  for(let i=0;i<n;i++)dot.append(h('b','',n>1?'Вариант '+(i+1):'Кнопка'));
  map.append(h('i','gx'),h('i','gy'),dot);
  const z=h('div','pz','экран игры');z.style.top='6px';map.append(z);
  box.append(map,info);
  const SX=[50,82],SY=[50,59,82],TH=4;
  const place=()=>{dot.style.left=s.px+'%';dot.style.top=s.py+'%';info.textContent='Центр кнопок: '+Math.round(s.px)+'% слева, '+Math.round(s.py)+'% сверху. Подвинь пальцем; рядом с центром сама «прилипнет».'};
  const move=e=>{
    const r=map.getBoundingClientRect();
    let x=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100)),y=Math.max(6,Math.min(94,(e.clientY-r.top)/r.height*100));
    const sx=SX.find(v=>Math.abs(x-v)<TH),sy=SY.find(v=>Math.abs(y-v)<TH);
    if(sx!==undefined)x=sx;if(sy!==undefined)y=sy;
    map.classList.toggle('sx',sx!==undefined);map.classList.toggle('sy',sy!==undefined);
    s.px=Math.round(x*10)/10;s.py=Math.round(y*10)/10;place();changed();
  };
  map.addEventListener('pointerdown',e=>{e.preventDefault();map.setPointerCapture(e.pointerId);map.dragging=true;move(e)});
  map.addEventListener('pointermove',e=>{if(map.dragging)move(e)});
  const stop=()=>{map.dragging=false;map.classList.remove('sx','sy')};
  map.addEventListener('pointerup',stop);map.addEventListener('pointercancel',stop);
  const show=()=>{box.style.display=sel.value==='custom'?'block':'none'};
  sel.addEventListener('change',()=>{
    s.pos=sel.value;
    if(sel.value==='custom'&&!isFinite(parseFloat(s.px))){s.px=50;s.py=s.type==='button'?82:59;place()}
    if(s.type==='button')s.align=sel.value==='center'?'center':'end';
    show();changed()});
  if(!isFinite(parseFloat(s.px))){s.px=50;s.py=s.type==='button'?82:59}
  place();show();w.append(box);return w;
}
function field(s,[k,label,kind,opts]){
  if(kind==='pos')return posField(s,label,opts);
  const w=h('label','fld');w.append(h('span','',label));let c;
  if(kind==='sel'){c=h('select');opts.forEach(([v,t])=>{const o=h('option','',t);o.value=v;c.append(o)});c.value=s[k]??opts[0][0]}
  else if(kind==='area'||kind==='lines'){c=h('textarea');c.rows=kind==='lines'?5:3;c.value=kind==='lines'?(s[k]||[]).join('\n'):(s[k]||'')}
  else{c=h('input');c.type=(kind==='num'||kind==='fotonum')?'number':'text';if(c.type==='number')c.step='any';c.value=s[k]??''}
  c.addEventListener('input',()=>{s[k]=kind==='lines'?c.value.split('\n').filter(x=>x.trim()):c.value;changed()});
  w.append(c);
  if(kind==='img'||kind==='fotonum'||kind==='audio'){
    const up=h('div','up'),dir=PHOTO_DIR.replace(/\/$/,'');
    const bt=(l,fn)=>{const b=h('button','',l);b.type='button';b.onclick=e=>{e.preventDefault();fn(b)};up.append(b)};
    const setV=v=>{c.value=v;s[k]=String(v);changed()};
    const run=async f=>{try{eSt('Загружаю…');await f();eSt('✅ Загружено. Для других игроков появится через 1–2 минуты.')}catch(e){eSt('❌ '+e.message)}};
    const put=async(blob,path,name)=>{await ghPut(path,blob,'Загрузка '+name);LOCAL[name]=URL.createObjectURL(blob)};
    if(kind==='img'||kind==='fotonum')bt('📷 Загрузить фото',()=>run(async()=>{
      const f=await pickFile('image/*');if(!f)return;
      const pre=kind==='img'?'item':'foto',n=await nextNum(pre,dir),name=pre+n+'.jpg';
      await put(await toJpeg(f),PHOTO_DIR+name,name);setV(kind==='img'?name:n)}));
    if(kind==='audio'){
      bt('🎙 Записать',b=>recToggle(b,blob=>run(async()=>{const n=await nextNum('golos'),name='golos'+n+'.wav';await put(blob,name,name);setV(name)})));
      bt('📁 Файл',()=>run(async()=>{
        const f=await pickFile('audio/*');if(!f)return;
        const n=await nextNum('golos'),name='golos'+n+'.'+(f.name.split('.').pop()||'mp3').toLowerCase();
        await put(f,name,name);setV(name)}));
      bt('▶ Слушать',()=>{if(s[k])new Audio(LOCAL[s[k]]||s[k]).play().catch(()=>{})});
    }
    w.append(up);
  }
  return w;
}
async function initEditor(){
  const d=localStorage.getItem('draft');
  story=d?JSON.parse(d):await storyP;
  preload(story.steps);
  eSt(d?'Загружен твой черновик. Кнопка «Сброс» вернёт версию с сайта.':'Загружена версия с сайта.');
  redraw();
  $('eP').onclick=()=>{document.body.className='edit pv';startGame(0)};
  $('eS').onclick=publish;
  $('eD').onclick=()=>{const a=h('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(story,null,1)],{type:'application/json'}));a.download='story.json';a.click()};
  $('eR').onclick=async()=>{if(confirm('Отбросить черновик и загрузить версию с сайта?')){localStorage.removeItem('draft');story=await loadStory();redraw();eSt('Загружена версия с сайта.')}};
  $('exitpv').onclick=()=>{runId++;resetStage();document.body.className='edit'};
}
$('invbtn').onclick=()=>{$('invp').style.display=$('invp').style.display==='block'?'none':'block'};
$('invx').onclick=()=>{$('invp').style.display='none'};
['invbtn','invp','invd'].forEach(i=>$(i).addEventListener('pointerdown',e=>e.stopPropagation()));
const storyP=loadStory();
if(/[?&]edit/.test(location.search)){$('start').remove();document.body.className='edit';initEditor()}
else $('start').addEventListener('click',async()=>{$('start').remove();story=await storyP;preload(story.steps);startGame(0)},{once:true});
</script>
