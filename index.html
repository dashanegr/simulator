<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:relative;width:min(100vw,480px);height:100dvh;margin:0 auto;overflow:hidden;background:#000}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.lid{position:absolute;left:0;right:0;height:50.5%;background:#000;transition:transform .5s ease-in-out}
#lidT{top:0}#lidB{bottom:0}
.txt{color:#fff;font-weight:800;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 2px 6px #000;line-height:1.25}
#title{font-family:"Marck Script","Segoe Script","Brush Script MT",cursive;font-weight:400;-webkit-text-stroke:0;text-shadow:0 0 20px rgba(255,255,255,.45);font-size:58px;line-height:1.3;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:46px;opacity:0;transition:opacity 2s;white-space:pre-line;z-index:5;pointer-events:none}
#lines{position:absolute;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));padding:0 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;z-index:5;pointer-events:none}
.line{font-size:24px;opacity:0;max-height:220px;transform-origin:center bottom;transition:opacity 1s,transform .8s,max-height .7s,margin .7s}
.ch{opacity:0;transition:opacity .3s}.ch.on{opacity:1}
.line.show{opacity:1}
.line.back{transform:scale(.67)}
.line.show.back{opacity:.5}
.line.me{color:#5b9bd5}
.line.gone{opacity:0!important;max-height:0;margin:-8px 0 0}
#center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:0 22px;text-align:center;font-size:26px;opacity:0;transition:opacity 1s;z-index:5;pointer-events:none}
#ring{position:absolute;left:0;right:0;top:55%;text-align:center;font-size:30px;opacity:0;transition:opacity 1s,top 1s;z-index:5;pointer-events:none}
#btns{position:absolute;left:0;right:0;top:55%;display:flex;gap:10px;z-index:7;padding:0 14px}
#btns.end{justify-content:flex-end;padding:0 10px 0 0;top:calc(77% + 20px)}
#btns.center{justify-content:center}
.btn{font:700 17px system-ui,sans-serif;color:#fff;background:rgba(20,20,20,.78);border:2px solid rgba(255,255,255,.85);padding:13px 22px;border-radius:14px;opacity:0;transition:opacity 1s}
#btns.row .btn{flex:1;font-size:14px;padding:12px 8px}
.btn.show{opacity:1}
.btn:active{background:rgba(70,70,70,.9)}
#list{position:absolute;left:18px;right:18px;top:26%;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:16px;z-index:6;opacity:0;transition:opacity 1s;pointer-events:none}
#list.show{opacity:1;pointer-events:auto}
#list h3{margin:0 0 10px;color:#fff;font-size:19px}
.item{display:flex;align-items:center;gap:12px;color:#fff;font-size:18px;padding:10px 0}
.box{width:28px;height:28px;border:2px solid #fff;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px;z-index:20;background:#000}
#editor,#exitpv{display:none}
body.edit:not(.pv) #editor{display:block}
body.edit:not(.pv) #stage{display:none}
body.pv #exitpv{display:block}
#exitpv{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:30;opacity:.6;background:#000;color:#fff;border:1px solid #888;border-radius:10px;padding:8px 12px;font-size:14px}
#editor{position:fixed;inset:0;overflow:auto;background:#141414;color:#eee;font:15px system-ui,sans-serif;user-select:text}
#editor *{user-select:text}
#editor .wrap{max-width:520px;margin:0 auto;padding:0 12px 60px}
#editor .top{position:sticky;top:0;background:#141414;padding:10px 0;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#editor button,#editor select{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 10px;font-size:14px}
#eSt{font-size:13px;color:#9c9;margin:4px 0 10px}
.card{background:#1e1e1e;border:1px solid #3a3a3a;border-radius:12px;padding:10px;margin:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ctr button{padding:6px 10px;margin-left:4px}
.fld{display:block;margin:8px 0}.fld span{display:block;font-size:12px;color:#aaa;margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:9px;font:15px system-ui}
.opt{border:1px dashed #666;border-radius:10px;padding:8px;margin:10px 0}
.nest{margin-left:6px;border-left:3px solid #4a6;padding-left:8px}.sub{font-size:12px;color:#aaa;margin-top:6px}
.addrow{display:flex;gap:6px;margin:10px 0}.addrow select{flex:1}
#editor .add{background:#245;border-color:#58a}#editor .del{background:#411;border-color:#a55;margin-top:6px}
#clock{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:14px;font-size:20px;-webkit-text-stroke:3px #000;z-index:6;opacity:0;transition:opacity .6s;pointer-events:none}
#invbtn{display:none;position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;z-index:9;font:700 15px system-ui,sans-serif;color:#fff;background:rgba(20,20,20,.78);border:2px solid rgba(255,255,255,.85);border-radius:14px;padding:8px 12px}
#invp{display:none;position:absolute;left:18px;right:18px;top:16%;z-index:12;background:rgba(0,0,0,.9);border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:16px;color:#fff}
#invp h3{margin:0 0 8px;font-size:20px}.iv{padding:9px 0;font-size:17px;border-bottom:1px solid rgba(255,255,255,.15)}
#invx{margin-top:12px;font:700 15px system-ui;color:#fff;background:#222;border:1px solid #888;border-radius:10px;padding:9px 16px}
#invl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{text-align:center;font-size:13px}
.th{aspect-ratio:1;border:2px solid #fff;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;background:#111;margin-bottom:4px}.th img{width:100%;height:100%;object-fit:contain}
#invd{display:none;position:absolute;left:12px;right:12px;top:8%;max-height:84%;overflow:auto;z-index:14;background:rgba(0,0,0,.95);border:1px solid #888;border-radius:16px;padding:14px;color:#fff;text-align:center}
#invd img{max-width:100%;max-height:45vh;border-radius:12px}#invd p{font-size:16px;line-height:1.35}
#invd .row{display:flex;gap:10px;justify-content:center;margin-top:10px}#invd button{font:700 15px system-ui;color:#fff;background:#222;border:1px solid #888;border-radius:10px;padding:10px 16px}
#notices{position:absolute;left:0;right:0;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 200px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.nt{font-size:13px;font-weight:600;color:#fff;padding:6px 16px;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(0,0,0,.6);opacity:0;transition:opacity .5s}
.nt.show{opacity:.9}.nt.show.back{opacity:.4}.nt.gone{opacity:0!important}.up{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
</style>
</head>
<body>
<div id="stage">
  <img class="photo" id="pA" alt=""><img class="photo" id="pB" alt="">
  <div id="veil"></div>
  <div class="lid" id="lidT"></div><div class="lid" id="lidB"></div>
  <div id="title" class="txt"></div>
  <div id="ring" class="txt"></div>
  <div id="center" class="txt"></div>
  <div id="lines"></div>
  <div id="list"><h3>Собрать вещи:</h3><div id="items"></div></div>
  <div id="btns"></div>
  <div id="clock" class="txt"></div><div id="notices"></div>
  <button id="invbtn">🎒 Инвентарь</button>
  <div id="invd"></div>
  <div id="invp"><h3>Инвентарь</h3><div id="invl"></div><button id="invx">Закрыть</button></div>
  <button id="exitpv">← Редактор</button>
  <div id="start">Нажмите, чтобы начать</div>
</div>
<div id="editor"><div class="wrap"><div class="top"><button id="eP">▶ С начала</button><button id="eS">💾 Сохранить для всех</button><button id="eD">⬇ Файл</button><button id="eR">↺ Сброс</button></div><div id="eSt"></div><div id="eL"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const raf=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const PHOTO_DIR=''; // папка с фото, например 'photos/' (если лежат рядом с index.html — оставь пустым)
const PHOTO_COUNT=12;
const LOCAL={};const url=n=>LOCAL[n]||PHOTO_DIR+n; // когда добавишь новые фото — увеличь число
for(let i=1;i<=PHOTO_COUNT;i++){new Image().src=PHOTO_DIR+'foto'+i+'.jpg'}

/* ---------- фото ---------- */
let cur=$('pA'),oth=$('pB');
async function setPhoto(n,ms=0){
  oth.src=url('foto'+n+'.jpg');
  oth.style.transition=cur.style.transition=ms?`opacity ${ms}ms`:'none';
  oth.style.opacity=1;cur.style.opacity=0;
  [cur,oth]=[oth,cur];
  await sleep(ms);
}
/* ---------- веки и затемнение ---------- */
let lidsOpen=false;
async function lids(f,ms){lidsOpen=f>=1;
  $('lidT').style.transition=$('lidB').style.transition=`transform ${ms}ms ease-in-out`;
  $('lidT').style.transform=`translateY(${-f*100}%)`;
  $('lidB').style.transform=`translateY(${f*100}%)`;
  await sleep(ms);
}
async function fade(to,ms){$('veil').style.transition=`opacity ${ms}ms`;$('veil').style.opacity=to;await sleep(ms)}
async function blinkOpen(){
  await lids(.5,700);await sleep(300);
  await lids(0,500);await sleep(500);
  await lids(1,1100);
}
async function shortBlink(n){await lids(0,160);await setPhoto(n,0);await lids(1,220)}

/* ---------- надписи-диалог ---------- */
let skip=null;
$('stage').addEventListener('pointerdown',()=>{if(skip)skip()});
function hold(ms){return new Promise(res=>{const t=setTimeout(done,ms);const t0=Date.now();
  function done(){clearTimeout(t);skip=null;res()}
  skip=()=>{if(Date.now()-t0>500)done()}})}
async function say(text,cls='',audio){
  if(audio){try{new Audio(LOCAL[audio]||audio).play().catch(()=>{})}catch(e){}}
  const box=$('lines');
  const f=box.querySelector('.front'),b=box.querySelector('.back:not(.gone)');
  if(b){b.classList.add('gone');setTimeout(()=>b.remove(),800)}
  if(f){f.classList.remove('front');f.classList.add('back')}
  const el=document.createElement('div');
  el.className='line txt front '+cls;
  // видимая часть + невидимый «хвост»: перенос строк сразу как в финале, ничего не прыгает
  const vis=document.createElement('span'),hid=document.createElement('span');
  hid.style.visibility='hidden';hid.style.webkitTextStroke='0';hid.style.textShadow='none';
  el.append(vis,hid);
  box.appendChild(el);await raf();el.classList.add('show');
  const ch=Array.from(text);
  let fast=false;skip=()=>{fast=true};
  for(let i=1;i<=ch.length;i++){
    vis.textContent=ch.slice(0,i).join('');
    hid.textContent=ch.slice(i).join('');
    if(!fast&&i<ch.length)await sleep(/[.,!?…:]/.test(ch[i-1])?230:45);
  }
  await hold(900+text.length*22);
}
async function clearLines(){
  const els=[...$('lines').children];
  els.forEach(e=>e.classList.add('gone'));
  await sleep(900);els.forEach(e=>e.remove());
}
async function centerText(t,ms=3500){
  const c=$('center');c.textContent=t;c.style.opacity=1;await sleep(ms);c.style.opacity=0;await sleep(1000);
}

/* ---------- кнопки ---------- */
// align: 'end' (прижата вправо), 'center', 'row' (несколько в ряд)
function ask(labels,align='end'){
  return new Promise(async res=>{
    const w=$('btns');w.className=align;w.innerHTML='';
    const bs=labels.map((l,i)=>{
      const b=document.createElement('button');b.className='btn';b.textContent=l;
      b.addEventListener('pointerdown',e=>e.stopPropagation());
      b.addEventListener('click',async()=>{
        bs.forEach(x=>x.classList.remove('show'));await sleep(500);w.innerHTML='';res(i)});
      w.appendChild(b);return b});
    await raf();bs.forEach(b=>b.classList.add('show'));
  });
}

/* ---------- сцена-шаблон ---------- */
async function scene(n,lines){
  await setPhoto(n,0);
  await fade(0,2500);
  for(const [t,c] of lines)await say(t,c);
  await fade(1,2500);
  await clearLines();
  await ask(['Далее']);
}

/* ---------- СЮЖЕТ (по умолчанию; потом берётся из story.json) ---------- */
const S=(text,who)=>({type:'say',text,who:who||'npc'});
const V=to=>({type:'veil',to:String(to)});
const B=(label,align)=>({type:'button',label:label||'Далее',align:align||'end'});
const P=(n,fx)=>({type:'photo',n:String(n),fx});
const DEFAULT={steps:[
 {type:'title',text:'Акт 1:\nНачало'},P(1,'hidden'),
 S('— Гоша, ты опять напился?!'),S('— Да не пил я!'),S('— А ну дыхни.'),S('— Ой, смотри, что это?'),S('— Что?'),
 {type:'blink'},
 S('— Да это же ребёнок!'),S('— Привет, сахарок ☺️'),P(2,'shortblink'),
 S('— А сахарок-то подгоревший 😏'),S('— Да помолчи ты!'),V(1),B(),
 P(3,'cut'),V(0),S('— С днём рождения! Это Олег, хорошо ухаживай за ним.'),S('— Укх бу юа бы эт'),S('— Что ты делаешь?'),S('— Перевожу это на её язык, чтобы ей было понятнее.'),S('— *вздох разочарования в идиоте*'),V(1),B(),
 P(4,'cut'),V(0),S('— Поздравляю с 10-летием, уголёк! Расти большой, чтобы легко доставать до самых высоких пальм с кокосами!'),S('— Не слушай папу, солнышко, у этой пьяни все мозги уже пропиты.'),V(1),B(),
 P(5,'cut'),V(0),S('— С 15-летием, Дашулепулешушечучечка! Ты уже такая большая 😢 Держи подарок, скоро торт начнём резать!'),B(),
 P(6,'fade'),S('— Спасибо, я отнесу его в комнату?','me'),S('— Да, конечно.'),B(),
 P(7,'fadeblack'),B('Зайти'),P(8,'fade'),
 {type:'call',text:'*звонок*',label:'Взять трубку'},
 P(9,'quick'),S('— Дарья Дмитриевна.'),S('— Да, а вы кто?','me'),S('— Машина ждёт вас внизу.'),S('— Меня? Зачем?','me'),S('— Без вопросов, просто садитесь.'),
 P(10,'fade'),
 {type:'choice',options:[
  {label:'Собрать вещи и спуститься вниз',back:'',steps:[]},
  {label:'Что за машина? Куда спускаться? Я никуда не поеду, я что, дура?!',back:'1',steps:[{type:'center',text:'Так, дура, не ломай весь сюжет! А ну быстро собрала свои пожитки и села в машину!'}]}]},
 {type:'checklist',title:'Собрать вещи:',items:['Часы','Рюкзак','Горшочек с хлопком (на всякий случай)','Мотыга (ну вдруг пригодится)','Новую одежду'],label:'Далее'},
 P(11,'fade'),B('Спуститься вниз','center'),P(12,'fadeblack'),B('Сесть в машину','center')
]};

/* ---------- ИНВЕНТАРЬ, ВРЕМЯ, НАДПИСИ В ОВАЛЕ ---------- */
let inv=[],act=[],invOn=false,clockText='';
const invFind=n=>inv.findIndex(x=>x.name.toLowerCase().includes(n.trim().toLowerCase()));
const isAct=n=>act.some(a=>a.toLowerCase().includes(n.trim().toLowerCase()));
const invAdd=n=>{if(!inv.some(x=>x.name.toLowerCase()===n.toLowerCase()))inv.push({name:n})};
function updInv(){
  $('invbtn').style.display=invOn?'block':'none';
  const l=$('invl');l.innerHTML='';
  if(!inv.length){l.textContent='Пусто';return}
  inv.forEach(x=>{
    const d=document.createElement('div');d.className='tile';
    const th=document.createElement('div');th.className='th';
    if(x.photo){const im=document.createElement('img');im.src=url(x.photo);im.onerror=()=>{im.remove();th.textContent='📦'};th.append(im)}else th.textContent='📦';
    const nm=document.createElement('div');nm.textContent=x.name;
    d.append(th,nm);d.onclick=()=>openItem(x);l.append(d)});
}
function openItem(x){
  const d=$('invd');d.innerHTML='';
  if(x.photo){const im=document.createElement('img');im.src=url(x.photo);im.onerror=()=>im.remove();d.append(im)}
  const t=document.createElement('h3');t.textContent=x.name;d.append(t);
  if(x.desc){const p=document.createElement('p');p.textContent=x.desc;d.append(p)}
  const row=document.createElement('div');row.className='row';
  if(x.can){const a=document.createElement('button');a.textContent='Активировать';a.onclick=()=>activateItem(x);row.append(a)}
  const b=document.createElement('button');b.textContent='Назад';b.onclick=()=>{d.style.display='none'};row.append(b);
  d.append(row);d.style.display='block';
}
function activateItem(x,silent){
  const i=inv.indexOf(x);if(i>=0)inv.splice(i,1);
  act.push(x.name);
  $('invd').style.display='none';$('invp').style.display='none';updInv();
  if(x.actText&&!silent)notice(x.actText,false,x.actSec);
}
function applyInv(s){
  const n=(s.name||'').trim();if(!n)return;
  const i=invFind(n);
  if(s.action==='remove'){if(i>=0)inv.splice(i,1)}
  else if(s.action==='activate'){if(i>=0)activateItem(inv[i],true);else act.push(n)}
  else if(s.action==='deactivate'){act=act.filter(a=>!a.toLowerCase().includes(n.toLowerCase()))}
  else{
    let it=i>=0?inv[i]:null;
    if(!it){it={name:n[0].toUpperCase()+n.slice(1)};inv.push(it)}
    if(s.photo)it.photo=s.photo.trim();
    if(s.desc)it.desc=s.desc;
    if(s.can==='1')it.can=true;
    if(s.actText)it.actText=s.actText;
    if(s.actSec)it.actSec=s.actSec;
    invOn=true}
  updInv();
}
function showClock(t){clockText=t||'';const c=$('clock');c.textContent=clockText;c.style.opacity=clockText?1:0}
async function notice(t,wait=true,sec){
  const box=$('notices'),ms=(parseFloat(sec)||2.6)*1000;
  const kill=o=>{o.classList.add('gone');setTimeout(()=>o.remove(),600)};
  [...box.querySelectorAll('.nt:not(.gone)')].forEach(o=>{if(o.classList.contains('back'))kill(o);else o.classList.add('back')});
  const e=document.createElement('div');e.className='nt';e.textContent=t;
  box.appendChild(e);await raf();e.classList.add('show');
  const p=sleep(ms).then(()=>{if(!e.classList.contains('gone'))kill(e)});
  if(wait)await p;
}

/* ---------- ИНТЕРПРЕТАТОР ---------- */
let story=null,runId=0;
const CHK=id=>{if(id!==runId)throw 'abort'};
async function runSteps(steps,id){for(const s of steps){CHK(id);await doStep(s,id);CHK(id)}}
async function photo(s){
  const n=+s.n,fx=s.fx||'fade';
  if(fx==='hidden'){await setPhoto(n,0);return}
  if(fx==='shortblink'){await shortBlink(n);return}
  await clearLines();
  if(!lidsOpen)await lids(1,0);
  if(fx==='cut')await setPhoto(n,0);
  else if(fx==='quick')await setPhoto(n,400);
  else if(fx==='fadeblack'){await fade(1,1500);await setPhoto(n,0);await fade(0,1500)}
  else await setPhoto(n,1800);
}
async function doStep(s,id){
  switch(s.type){
  case 'title':{const T=$('title');T.textContent=s.text;T.style.opacity=1;await sleep(4000);T.style.opacity=0;await sleep(2500);break}
  case 'say':await say(s.text||'',s.who==='me'?'me':'',s.audio);break;
  case 'center':await centerText(s.text||'');break;
  case 'photo':await photo(s);break;
  case 'veil':await fade(+s.to,2500);if(+s.to===1)await clearLines();break;
  case 'blink':await blinkOpen();break;
  case 'button':await ask([s.label||'Далее'],s.align||'end');await clearLines();break;
  case 'call':{
    const R=$('ring');R.style.top='55%';R.textContent=s.text||'*звонок*';R.style.opacity=1;
    await sleep(1300);R.style.top='46%';
    await ask([s.label||'Взять трубку'],'center');R.style.opacity=0;break}
  case 'checklist':{
    const I=$('items');I.innerHTML='';$('list').querySelector('h3').textContent=s.title||'';
    const its=s.items||[];let left=its.length;
    const done=new Promise(res=>{
      if(!left)res();
      its.forEach((t,k)=>{
        const d=document.createElement('div');d.className='item';
        d.innerHTML='<div class="box"></div><div></div>';d.lastChild.textContent=(k+1)+') '+t;
        let on=false;
        d.addEventListener('pointerdown',e=>e.stopPropagation());
        d.addEventListener('click',()=>{if(on)return;on=true;d.firstChild.textContent='✓';if(--left===0)res()});
        I.appendChild(d)})});
    $('list').classList.add('show');await done;await sleep(400);invOn=true;updInv();
    await ask([s.label||'Далее']);$('list').classList.remove('show');await sleep(1000);break}
  case 'clock':showClock(s.text);break;
  case 'inv':applyInv(s);if(s.text)await notice(s.text,s.wait!=='0',s.sec);break;
  case 'notice':await notice(s.text||'',s.wait!=='0',s.sec);break;
  case 'if':{
    const n=(s.name||'').trim(),a=isAct(n),hv=invFind(n)>=0;
    const ok=s.cond==='notactive'?!a:s.cond==='have'?hv:a;
    await runSteps((ok?s.then:s.else)||[],id);break}
  case 'choice':{
    const o=s.options||[];let idx=o.map((_,i)=>i);
    while(idx.length){
      const labels=idx.map(i=>o[i].label);
      const k=await ask(labels,labels.length>1?'row':'center');CHK(id);
      const op=o[idx[k]];
      await runSteps(op.steps||[],id);
      if(op.back&&idx.length>1)idx.splice(k,1);else break}
    break}
  }
}
function resetStage(){
  skip=null;
  ['pA','pB'].forEach(i=>{$(i).style.transition='none';$(i).style.opacity=0});
  cur=$('pA');oth=$('pB');
  $('veil').style.transition='none';$('veil').style.opacity=0;
  lids(0,0);
  $('lines').innerHTML='';$('btns').innerHTML='';
  ['title','ring','center'].forEach(i=>$(i).style.opacity=0);
  $('list').classList.remove('show');
  inv=[];act=[];invOn=false;$('invp').style.display='none';$('invd').style.display='none';$('notices').innerHTML='';showClock('');updInv();
}
async function startGame(from=0){
  const id=++runId;resetStage();
  const steps=story.steps,prev=steps.slice(0,from);
  for(const x of prev){if(x.type==='checklist'){invOn=true}else if(x.type==='inv')applyInv(x);else if(x.type==='clock')clockText=x.text||''}
  updInv();showClock(clockText);
  const lp=[...prev].reverse().find(x=>x.type==='photo');
  if(lp)await setPhoto(+lp.n,0);
  if(prev.some(x=>x.type==='blink'||(x.type==='photo'&&x.fx!=='hidden')))await lids(1,0);
  const lv=[...prev].reverse().find(x=>x.type==='veil');
  if(lv)await fade(+lv.to,0);
  try{await runSteps(steps.slice(from),id)}catch(e){if(e!=='abort')console.error(e)}
}
async function loadStory(){
  let st;
  try{const r=await fetch('story.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;st=await r.json();if(!st.steps)throw 0}
  catch(e){st=JSON.parse(JSON.stringify(DEFAULT))}
  return st;
}
function preload(steps){steps.forEach(s=>{if(s.type==='photo')new Image().src=PHOTO_DIR+'foto'+(+s.n)+'.jpg';(s.options||[]).forEach(o=>preload(o.steps||[]))})}

 veil:{name:'🌗 Затемнение / осветление',f:[['to','Что сделать','sel',[['1','Затемнить экран'],['0','Осветлить экран']]]],d:()=>V(1)},
 blink:{name:'👁 Открыть глаза (моргание)',f:[],d:()=>({type:'blink'})},

 call:{name:'📞 Звонок',f:[['text','Надпись','text'],['label','Кнопка','text']],d:()=>({type:'call',text:'*звонок*',label:'Взять трубку'})},
 checklist:{name:'☑️ Список вещей',f:[['title','Заголовок','text'],['items','Пункты (каждый с новой строки)','lines'],['label','Кнопка','text']],d:()=>({type:'checklist',title:'',items:[],label:'Далее'})},
 clock:{name:'🕒 Время в углу',f:[['text','Что показывать (например 14:30). Пусто — спрятать','text']],d:()=>({type:'clock',text:''})},
 inv:{name:'🎒 Инвентарь',f:[['action','Действие','sel',[['add','Добавить предмет / задать его данные'],['activate','Активировать (предмет исчезнет из инвентаря)'],['deactivate','Сделать неактивированным'],['remove','Убрать предмет']]],['name','Название предмета (например: часы)','text'],['photo','Фото предмета','img'],['desc','Описание при рассматривании','area'],['can','Кнопка «Активировать» в просмотре','sel',[['','Без кнопки'],['1','Есть кнопка']]],['actText','Надпись в овале, когда игрок нажмёт «Активировать»','text'],['actSec','Сколько секунд показывать эту надпись (по умолчанию 2.6)','num'],['text','Надпись в овале на этом шаге (например: Часы добавлены в инвентарь)','text'],['sec','Сколько секунд показывать эту надпись (по умолчанию 2.6)','num'],['wait','После надписи','sel',[['1','Подождать, пока исчезнет'],['0','Сразу идти дальше']]]],d:()=>({type:'inv',action:'add',name:'',photo:'',desc:'',can:'',actText:'',text:'',wait:'1'})},
 if:{name:'❓ Если предмет…',f:[['name','Название предмета (например: часы)','text'],['cond','Условие','sel',[['active','Предмет активирован'],['notactive','Предмет НЕ активирован'],['have','Предмет сейчас в инвентаре']]]],d:()=>({type:'if',name:'',cond:'active',then:[],else:[]})},
 notice:{name:'🔖 Надпись в овале',f:[['text','Текст','text'],['sec','Сколько секунд показывать (по умолчанию 2.6)','num'],['wait','После надписи','sel',[['1','Подождать, пока исчезнет'],['0','Сразу идти дальше']]]],d:()=>({type:'notice',text:'',wait:'1'})},
 choice:{name:'🔀 Выбор',f:[],d:()=>({type:'choice',options:[{label:'',back:'',steps:[]},{label:'',back:'',steps:[]}]})}
};
const eSt=t=>$('eSt').textContent=t;
const changed=()=>{localStorage.setItem('draft',JSON.stringify(story));eSt('Черновик сохранён в этом браузере. Нажми «Сохранить для всех».')};
function redraw(){const y=$('editor').scrollTop;$('eL').innerHTML='';renderList(story.steps,$('eL'),true);$('editor').scrollTop=y}
function renderList(steps,parent,top){
  steps.forEach((s,i)=>{
    const T=TYPES[s.type],c=h('div','card'),bar=h('div','bar'),ctr=h('span','ctr');
    bar.append(h('b','',(top?(i+1)+'. ':'')+T.name));
    const bt=(l,fn)=>{const b=h('button','',l);b.onclick=fn;ctr.append(b)};
    if(top)bt('▶',()=>{document.body.className='edit pv';startGame(i)});
    bt('↑',()=>{if(i>0){[steps[i-1],steps[i]]=[steps[i],steps[i-1]];changed();redraw()}});
    bt('↓',()=>{if(i<steps.length-1){[steps[i+1],steps[i]]=[steps[i],steps[i+1]];changed();redraw()}});
    bt('✕',()=>{if(confirm('Удалить этот блок?')){steps.splice(i,1);changed();redraw()}});
    bar.append(ctr);c.append(bar);
    T.f.forEach(f=>c.append(field(s,f)));
    if(s.type==='choice'){
      s.options.forEach((o,k)=>{
        const ob=h('div','opt');ob.append(h('b','',`Вариант ${k+1}`));
        ob.append(field(o,['label','Текст кнопки','text']));
        ob.append(field(o,['back','После этого варианта','sel',[['','Идти дальше по сюжету'],['1','Вернуться к выбору (этот вариант пропадёт)']]]));
        ob.append(h('div','sub','Что происходит после нажатия:'));
        const n=h('div','nest');renderList(o.steps,n,false);ob.append(n);
        const del=h('button','del','Удалить вариант');del.onclick=()=>{if(s.options.length>1&&confirm('Удалить вариант?')){s.options.splice(k,1);changed();redraw()}};
        ob.append(del);c.append(ob)});
      const add=h('button','add','+ Ещё вариант');add.onclick=()=>{s.options.push({label:'',back:'',steps:[]});changed();redraw()};c.append(add);
    }
    if(s.type==='if'){[['then','Тогда:'],['else','Иначе (необязательно):']].forEach(([k,l])=>{s[k]=s[k]||[];c.append(h('div','sub',l));const n=h('div','nest');renderList(s[k],n,false);c.append(n)})}
    parent.append(c);
  });
  const row=h('div','addrow'),sel=h('select');
  Object.keys(TYPES).forEach(k=>{const o=h('option','',TYPES[k].name);o.value=k;sel.append(o)});
  const b=h('button','add','+ Добавить');b.onclick=()=>{steps.push(TYPES[sel.value].d());changed();redraw()};
  row.append(sel,b);parent.append(row);
}
function ghAuth(){
  const m=location.hostname.match(/^(.+)\.github\.io$/);
  let repo=m?m[1]+'/'+location.pathname.split('/')[1]:(localStorage.gh_repo||prompt('Репозиторий в формате имя/репозиторий'));
  if(!m&&repo)localStorage.gh_repo=repo;
  let tk=localStorage.gh_token||prompt('Вставь токен GitHub (он хранится только в этом браузере)');
  if(!tk||!repo)throw new Error('Нужен токен GitHub');
  localStorage.gh_token=tk;
  return {repo,hd:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'}};
}
async function ghPut(path,blob,msg){
  const a=ghAuth(),api=`https://api.github.com/repos/${a.repo}/contents/${path}`;
  const b64=typeof blob==='string'?btoa(unescape(encodeURIComponent(blob))):await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(blob)});
  let sha;const g=await fetch(api,{headers:a.hd,cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('Ошибка '+g.status+' — проверь токен');
  const r=await fetch(api,{method:'PUT',headers:a.hd,body:JSON.stringify({message:msg,content:b64,sha})});
  if(!r.ok)throw new Error('Ошибка '+r.status+' — проверь токен и права');
}
async function nextNum(prefix,dir){
  const a=ghAuth();
  const r=await fetch(`https://api.github.com/repos/${a.repo}/contents/${dir||''}`,{headers:a.hd,cache:'no-store'});
  if(!r.ok)throw new Error('Не удалось прочитать список файлов ('+r.status+')');
  const re=new RegExp('^'+prefix+'(\\d+)\\.');let m=0;
  (await r.json()).forEach(f=>{const x=f.name.match(re);if(x)m=Math.max(m,+x[1])});
  return m+1;
}
async function publish(){
  eSt('Сохраняю…');
  try{await ghPut('story.json',JSON.stringify(story,null,1),'Обновление сюжета');eSt('✅ Сохранено. У всех обновится через 1–2 минуты.')}
  catch(e){eSt('❌ '+e.message);if(/токен/.test(e.message))localStorage.removeItem('gh_token')}
}
const pickFile=accept=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>r(i.files[0]||null);i.click()});
async function toJpeg(file){
  const bmp=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.88));
}
async function toWav(blob){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ac.decodeAudioData(await blob.arrayBuffer());ac.close();
  const sr=22050,n=Math.max(1,Math.round(buf.duration*sr));
  const oc=new OfflineAudioContext(1,n,sr),src=oc.createBufferSource();
  src.buffer=buf;src.connect(oc.destination);src.start();
  const out=(await oc.startRendering()).getChannelData(0);
  const v=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,out[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  return new Blob([v],{type:'audio/wav'});
}
let rec=null;
async function recToggle(btn,done){
  if(rec){rec.stop();return}
  const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];
  rec=new MediaRecorder(st);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());rec=null;btn.textContent='🎙 Записать';
    try{eSt('Обрабатываю запись…');await done(await toWav(new Blob(ch)))}catch(e){eSt('❌ '+e.message)}};
  rec.start();btn.textContent='⏹ Стоп';eSt('Идёт запись… нажми «Стоп», когда закончишь.');
}
function field(s,[k,label,kind,opts]){
  const w=h('label','fld');w.append(h('span','',label));let c;
  if(kind==='sel'){c=h('select');opts.forEach(([v,t])=>{const o=h('option','',t);o.value=v;c.append(o)});c.value=s[k]??opts[0][0]}
  else if(kind==='area'||kind==='lines'){c=h('textarea');c.rows=kind==='lines'?5:3;c.value=kind==='lines'?(s[k]||[]).join('\n'):(s[k]||'')}
  else{c=h('input');c.type=(kind==='num'||kind==='fotonum')?'number':'text';if(c.type==='number')c.step='any';c.value=s[k]??''}
  c.addEventListener('input',()=>{s[k]=kind==='lines'?c.value.split('\n').filter(x=>x.trim()):c.value;changed()});
  w.append(c);
  if(kind==='img'||kind==='fotonum'||kind==='audio'){
    const up=h('div','up'),dir=PHOTO_DIR.replace(/\/$/,'');
    const bt=(l,fn)=>{const b=h('button','',l);b.type='button';b.onclick=e=>{e.preventDefault();fn(b)};up.append(b)};
    const setV=v=>{c.value=v;s[k]=String(v);changed()};
    const run=async f=>{try{eSt('Загружаю…');await f();eSt('✅ Загружено. Для других игроков появится через 1–2 минуты.')}catch(e){eSt('❌ '+e.message)}};
    const put=async(blob,path,name)=>{await ghPut(path,blob,'Загрузка '+name);LOCAL[name]=URL.createObjectURL(blob)};
    if(kind==='img'||kind==='fotonum')bt('📷 Загрузить фото',()=>run(async()=>{
      const f=await pickFile('image/*');if(!f)return;
      const pre=kind==='img'?'item':'foto',n=await nextNum(pre,dir),name=pre+n+'.jpg';
      await put(await toJpeg(f),PHOTO_DIR+name,name);setV(kind==='img'?name:n)}));
    if(kind==='audio'){
      bt('🎙 Записать',b=>recToggle(b,blob=>run(async()=>{const n=await nextNum('golos'),name='golos'+n+'.wav';await put(blob,name,name);setV(name)})));
      bt('📁 Файл',()=>run(async()=>{
        const f=await pickFile('audio/*');if(!f)return;
        const n=await nextNum('golos'),name='golos'+n+'.'+(f.name.split('.').pop()||'mp3').toLowerCase();
        await put(f,name,name);setV(name)}));
      bt('▶ Слушать',()=>{if(s[k])new Audio(LOCAL[s[k]]||s[k]).play().catch(()=>{})});
    }
    w.append(up);
  }
  return w;
}
async function initEditor(){
  const d=localStorage.getItem('draft');
  story=d?JSON.parse(d):await storyP;
  preload(story.steps);
  eSt(d?'Загружен твой черновик. Кнопка «Сброс» вернёт версию с сайта.':'Загружена версия с сайта.');
  redraw();
  $('eP').onclick=()=>{document.body.className='edit pv';startGame(0)};
  $('eS').onclick=publish;
  $('eD').onclick=()=>{const a=h('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(story,null,1)],{type:'application/json'}));a.download='story.json';a.click()};
  $('eR').onclick=async()=>{if(confirm('Отбросить черновик и загрузить версию с сайта?')){localStorage.removeItem('draft');story=await loadStory();redraw();eSt('Загружена версия с сайта.')}};
  $('exitpv').onclick=()=>{runId++;resetStage();document.body.className='edit'};
}
$('invbtn').onclick=()=>{$('invp').style.display=$('invp').style.display==='block'?'none':'block'};
$('invx').onclick=()=>{$('invp').style.display='none'};
['invbtn','invp','invd'].forEach(i=>$(i).addEventListener('pointerdown',e=>e.stopPropagation()));
const storyP=loadStory();
if(/[?&]edit/.test(location.search)){$('start').remove();document.body.className='edit';initEditor()}
else $('start').addEventListener('click',async()=>{$('start').remove();story=await storyP;preload(story.steps);startGame(0)},{once:true});
